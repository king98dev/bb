if(F){if(F.ko||F.lft||F.down>0||(gr&&(F===gr.top||F===gr.bot))){F.m.h.getWorldPosition(P1);px=P1.x-(vrCal.x*c+vrCal.z*s);pz=P1.z-(-vrCal.x*s+vrCal.z*c);py=P1.y-vrCal.y}
else{const sc=F.root.scale.x,eye=(F.hipH+ST.hz+.77)*sc;px=F.x-(vrCal.x*c+vrCal.z*s);pz=F.z-(-vrCal.x*s+vrCal.z*c);py=F.py+eye-vrCal.y}}else{px=0;py=.9;pz=6.4}
const k=1-Math.exp(-dt*20);rig.rotation.y=th;rig.position.x+=(px-rig.position.x)*k;rig.position.y+=(py-rig.position.y)*k;rig.position.z+=(pz-rig.position.z)*k}
function vrFrame(dr,now){if(vrMsgT>0)vrMsgT-=dr;
if(XRON){vrPoll(dr);const F=ME;for(const f of FS){if(f===F){f.vr=true;f.vrSrcNow=vrLoc;vrSelf(f,true)}else{vrSelf(f,false);if(!(MP&&MP.role==='host'&&f===B&&B.rem)){f.vr=false;f.vrSrcNow=null}}}
vrRig(F,dr);if(now-vrHudT>100){vrHudT=now;vrHudDraw()}
if(F){if(F.hp<vrHpPrev-1)vrHap(null,.7,90);vrHpPrev=F.hp}
if(MP&&MP.role==='guest'&&MP.live&&now-vrSendT>33){vrSendT=now;const q=a=>a.map(x=>Math.round(x*1000)/1000);mpSend({t:'vr',h:q(vrLoc.h),l:q(vrLoc.l),r:q(vrLoc.r),vl:q(vrLoc.vl),vr:q(vrLoc.vr)})}}
if(MP&&MP.role==='host'&&B.rem){if(B.vrIn&&now-B.vrIn.at<600){B.vr=true;B.vrSrcNow=B.vrIn}else if(!(XRON&&ME===B)){B.vr=false;B.vrSrcNow=null}}
for(const f of FS)if(f.vr&&f.vrSrcNow){vrLean(f,f.vrSrcNow);vrArms(f,f.vrSrcNow)}}
function vrStart(){XRON=true;vrCal.set=false;vrFrames=0;hudM.visible=true;spot.castShadow=false;try{R.xr.setFoveation(1)}catch(e){}
if(UIM==='menu'&&!MP){humanA=true;startFight()}}
function vrExit(){XRON=false;rig.position.set(0,0,0);rig.rotation.set(0,0,0);for(const f of FS){f.vr=false;f.vrSrcNow=null;vrSelf(f,false)}spot.castShadow=true;hudM.visible=false;for(const k in vrDig){if(vrDig[k])press(k,0);vrDig[k]=0}rs();R.setPixelRatio(pr)}
R.xr.addEventListener('sessionstart',vrStart);R.xr.addEventListener('sessionend',vrExit);
async function vrEnter(){aInit();if(XRON)return;if(!navigator.xr){msg('VR NEEDS A WEBXR BROWSER (QUEST BROWSER / CHROME + HEADSET)',3);return}
let ok=false;try{ok=await navigator.xr.isSessionSupported('immersive-vr')}catch(e){}
if(!ok){msg('NO VR HEADSET FOUND — OPEN THIS PAGE IN YOUR HEADSET BROWSER',3);return}
try{const ss=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor']});R.xr.setReferenceSpaceType('local-floor');await R.xr.setSession(ss)}catch(e){msg('COULD NOT START VR: '+(e.message||e),3)}}
$('bvr').onclick=vrEnter;

// ---------- loop ----------
let last=performance.now(),ema=1/60,fc=0,adj=0;rs();syncUI();showMenu();if(lastCode)showOnline();
function loop(now){if(!XRON&&now-last<15.6)return;const dr=Math.min((now-last)/1000,.05);last=now;
let dt=dr*ts;T+=dt;if(hs>0){hs-=dr;dt=0}
if(MP&&MP.role!=='host')guestTick(now);else if(dt>0){if(G.go&&!G.over){G.t-=dt;if(G.t<=0){G.over=1;const a=A.hp/A.st.hp,b=B.hp/B.st.hp;msg(a===b?'DRAW':(a>b?A.name:B.name)+' WINS BY DECISION',9)}}step(A,B,dt);step(B,A,dt);groundTick(dt);collide();vrStrikes(dt)}
if(msgT>0){msgT-=dr;if(msgT<=0)$('msg').style.opacity=0}
for(const f of FS)applyPose(f);A.root.updateMatrixWorld(true);B.root.updateMatrixWorld(true);vrFrame(dr,now);
if(ts<1&&G.over)ts=Math.min(1,ts+dr*.15);
for(const q of SPK)if(q.l>0){q.l-=dr;q.m.position.addScaledVector(q.v,dr);q.v.y-=6*dr;q.m.material.opacity=Math.max(q.l*3,0);if(q.l<=0)q.m.visible=false}
if(C.mode===4&&A.ai){const sp=6*dr,sn=Math.sin(C.cur.az),cs=Math.cos(C.cur.az),fw=(RK.KeyW?1:0)-(RK.KeyS?1:0),rt=(RK.KeyD?1:0)-(RK.KeyA?1:0);C.ft.x+=(-sn*fw+cs*rt)*sp;C.ft.z+=(-cs*fw-sn*rt)*sp;C.ft.y=cl(.2,6,C.ft.y+((RK.KeyE?1:0)-(RK.KeyQ?1:0))*sp)}
if(UIM!=='fight')C.dAz+=dr*.2;fxTick(dr);if(!XRON)camUpdate(dr);else shake=0;
$('n0').textContent=A.name+' · OVR '+(A.st.ovr|0)+(MP&&ME===A?' · YOU':'');$('n1').textContent=B.name+' · OVR '+(B.st.ovr|0)+(MP&&ME===B?' · YOU':'');$('h0').style.width=A.hp/A.st.hp*100+'%';$('h1').style.width=B.hp/B.st.hp*100+'%';$('s0').style.width=A.sta/A.st.sta*100+'%';$('s1').style.width=B.sta/B.st.sta*100+'%';const t=Math.max(0,G.t|0);$('mid').textContent=((t/60)|0)+':'+('0'+t%60).slice(-2);
labels();{const sw=$('sbw'),on=gr&&gr.sub;sw.style.display=on?'block':'none';if(on){$('sb').style.width=cl(0,1,gr.sub.sp)*100+'%';$('sb').style.background=gr.sub.sp>.6?'#ff4a3a':'#ff9a2e'}}
if(MP&&MP.live&&MP.role==='host')hostSend(now);R.render(S,cam);ema+=(dr-ema)*.05;if(!XRON&&++fc%30===0){const f=1/ema;if(f<54&&pr>.7&&now-adj>1500){pr-=.15;R.setPixelRatio(pr);rs();adj=now}else if(f>59&&pr<Math.min(devicePixelRatio,1.5)&&now-adj>6000){pr+=.1;R.setPixelRatio(pr);rs();adj=now}}}
R.setAnimationLoop(loop);
})();
